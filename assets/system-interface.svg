<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Michael Vargas - System Interface V2</title>
  <desc id="desc">Expanded futuristic system interface panel with improved readability and arc-reactor style HUD aesthetics.</desc>

  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#071622"/>
      <stop offset="58%" stop-color="#030911"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="lineGrad3" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <pattern id="scan3" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#8cf7ff" opacity="0.05"/>
    </pattern>

    <filter id="glow3" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="360" fill="url(#bgGlow3)"/>
  <rect width="1600" height="360" fill="url(#grid3)"/>
  <rect width="1600" height="360" fill="url(#scan3)"/>

  <!-- scanning pulse -->
  <rect x="-280" y="0" width="280" height="360" fill="url(#lineGrad3)" opacity="0.07">
    <animate attributeName="x" values="-320;1680" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- frame -->
  <rect x="18" y="18" width="1564" height="324" fill="none" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1"/>
  <rect x="28" y="28" width="1544" height="304" fill="none" stroke="#00e5ff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- horizontal energy lines -->
  <line x1="70" y1="60" x2="1530" y2="60" stroke="url(#lineGrad3)" stroke-width="1.5" opacity="0.35"/>
  <line x1="70" y1="306" x2="1530" y2="306" stroke="url(#lineGrad3)" stroke-width="1.5" opacity="0.35"/>

  <!-- decorative pixels -->
  <g fill="#00e5ff">
    <rect x="92" y="78" width="8" height="8" opacity="0.18"><animate attributeName="opacity" values="0.05;0.40;0.05" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="118" y="98" width="10" height="10" opacity="0.20"><animate attributeName="opacity" values="0.05;0.55;0.05" dur="3.1s" repeatCount="indefinite"/></rect>
    <rect x="1452" y="82" width="8" height="8" opacity="0.20"><animate attributeName="opacity" values="0.05;0.50;0.05" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="1478" y="102" width="6" height="6" opacity="0.20"><animate attributeName="opacity" values="0.05;0.35;0.05" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="130" y="270" width="10" height="10" opacity="0.22"><animate attributeName="opacity" values="0.05;0.55;0.05" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="1468" y="272" width="10" height="10" opacity="0.22"><animate attributeName="opacity" values="0.05;0.55;0.05" dur="2.7s" repeatCount="indefinite"/></rect>
  </g>

  <!-- LEFT SECTION -->
  <g font-family="monospace" fill="#9ef8ff">
    <text x="90" y="85" font-size="20" letter-spacing="3" opacity="0.92">SYSTEM IDENTITY</text>
    <line x1="90" y1="98" x2="420" y2="98" stroke="#00e5ff" stroke-width="1" opacity="0.45"/>

    <text x="90" y="136" font-size="16" opacity="0.68">USER</text>
    <text x="200" y="136" font-size="17" opacity="0.96">MICHAEL VARGAS</text>

    <text x="90" y="168" font-size="16" opacity="0.68">FIELD</text>
    <text x="200" y="168" font-size="17" opacity="0.96">SYSTEMS ENGINEERING</text>

    <text x="90" y="200" font-size="16" opacity="0.68">CORE</text>
    <text x="200" y="200" font-size="17" opacity="0.96">SOFTWARE + INFRASTRUCTURE</text>

    <text x="90" y="232" font-size="16" opacity="0.68">FOCUS</text>
    <text x="200" y="232" font-size="17" opacity="0.96">BUILD / AUTOMATE / OPTIMIZE</text>

    <text x="90" y="278" font-size="15" opacity="0.65">STATUS</text>
    <rect x="190" y="266" width="170" height="14" rx="2" fill="#071c24" stroke="#00e5ff" stroke-opacity="0.18"/>
    <rect x="190" y="266" width="122" height="14" rx="2" fill="#00e5ff" opacity="0.78">
      <animate attributeName="width" values="104;140;122;132;122" dur="4.6s" repeatCount="indefinite"/>
    </rect>
    <text x="372" y="278" font-size="15" opacity="0.90">ONLINE</text>
  </g>

  <!-- CENTER SECTION -->
  <g font-family="monospace" text-anchor="middle">
    <text x="800" y="88" fill="#d4feff" font-size="21" letter-spacing="4" opacity="0.96">SYSTEM CORE // INITIALIZED</text>
    <line x1="565" y1="100" x2="1035" y2="100" stroke="#00e5ff" stroke-width="1" opacity="0.45"/>

    <text x="800" y="155" fill="#00e5ff" font-size="34" letter-spacing="1" filter="url(#glow3)">&gt; SYSTEMS ENGINEERING</text>
    <text x="800" y="194" fill="#9ef8ff" font-size="24" letter-spacing="1" opacity="0.92">SOFTWARE DEVELOPMENT // IT INFRASTRUCTURE</text>
    <text x="800" y="226" fill="#9ef8ff" font-size="20" letter-spacing="1" opacity="0.76">NETWORKS // DATABASES // AUTOMATION</text>
    <text x="800" y="266" fill="#9ef8ff" font-size="16" letter-spacing="2" opacity="0.56">BUILDING TECHNOLOGY FOR REAL-WORLD SYSTEMS</text>

    <!-- blinking cursor -->
    <rect x="1048" y="130" width="12" height="26" fill="#00e5ff" opacity="0.88">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- RIGHT SECTION -->
  <g font-family="monospace" fill="#9ef8ff">
    <text x="1185" y="85" font-size="20" letter-spacing="3" opacity="0.92">CORE MODULES</text>
    <line x1="1185" y1="98" x2="1498" y2="98" stroke="#00e5ff" stroke-width="1" opacity="0.45"/>

    <text x="1185" y="136" font-size="16" opacity="0.72">SOFTWARE ENGINEERING</text>
    <rect x="1185" y="145" width="220" height="14" rx="2" fill="#071c24" stroke="#00e5ff" stroke-opacity="0.16"/>
    <rect x="1185" y="145" width="172" height="14" rx="2" fill="#00e5ff" opacity="0.74">
      <animate attributeName="width" values="146;188;172;180;172" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="1185" y="184" font-size="16" opacity="0.72">IT INFRASTRUCTURE</text>
    <rect x="1185" y="193" width="220" height="14" rx="2" fill="#071c24" stroke="#00e5ff" stroke-opacity="0.16"/>
    <rect x="1185" y="193" width="178" height="14" rx="2" fill="#00e5ff" opacity="0.74">
      <animate attributeName="width" values="152;194;178;186;178" dur="4.4s" repeatCount="indefinite"/>
    </rect>

    <text x="1185" y="232" font-size="16" opacity="0.72">NETWORKS</text>
    <rect x="1185" y="241" width="220" height="14" rx="2" fill="#071c24" stroke="#00e5ff" stroke-opacity="0.16"/>
    <rect x="1185" y="241" width="164" height="14" rx="2" fill="#00e5ff" opacity="0.74">
      <animate attributeName="width" values="138;182;164;172;164" dur="5.6s" repeatCount="indefinite"/>
    </rect>

    <text x="1185" y="280" font-size="16" opacity="0.72">DATABASES / AUTOMATION</text>
    <rect x="1185" y="289" width="220" height="14" rx="2" fill="#071c24" stroke="#00e5ff" stroke-opacity="0.16"/>
    <rect x="1185" y="289" width="168" height="14" rx="2" fill="#00e5ff" opacity="0.74">
      <animate attributeName="width" values="142;186;168;176;168" dur="4.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
